name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:start
      - run: npm run db:test
      - run: npm run db:lint

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Production dependencies gate the build (NFR-S7). Dev tooling is reported
      # but not blocking: lint-only advisories (e.g. GHSA-vfj7-8cjw-p6xm in braces) can have no fix.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies (report only)
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: No Supabase secret keys outside supabase/
        run: "! git grep -nEi 'sb_secret_|service_role|SUPABASE_SECRET' -- . ':!supabase' ':!docs' ':!.github'"
