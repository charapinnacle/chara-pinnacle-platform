name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: cp apps/web/.env.example apps/web/.env.local
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Fail when a key route loads more JavaScript than its budget
        run: node scripts/check-bundle-budget.mjs apps/web/tests/perf-budget.json apps/web/.next/diagnostics/route-bundle-stats.json

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Reserve the local stack's ports
        # The runner hands out 32768-60999 to outgoing connections, the image pulls of db:start among them, and a port of
        # the stack or of an Edge Function (544xx) taken that way fails its bind with "address already in use".
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54420-54439
      - name: Start the local stack
        # The reservation cannot free a port that a socket opened before it already holds (54424 has failed this way), so a
        # failed start lists the sockets on the stack's ports and starts once more.
        run: |
          npm run db:start && exit 0
          sudo ss -tanp | grep -E ':544[23][0-9]\b' || true
          npm run db:stop -- --no-backup
          sleep 20
          npm run db:start
      - run: npm run db:test
      - run: npm run db:lint
      - run: npm run db:types
      - name: Fail when generated types differ from the committed file
        run: git diff --exit-code -- packages/db-types/src/database.ts
      - run: node scripts/gen-ref-seeds.mjs
      - name: Fail when regenerated reference seeds differ from the committed files
        run: git diff --exit-code -- supabase/seeds/ref

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: deno fmt --check
      - run: deno lint
      - run: deno check "*/index.ts"
      - run: deno test --frozen --allow-env=NODE_ENV

  # The projects of apps/web/playwright.config.ts form four groups that only wait for one another so as not to share a
  # database: on separate runners each group gets its own, so they run side by side. The release tests are two groups
  # (release, release-2), each about half of the chain.
  e2e:
    needs: [web, db]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [parallel, serial, release, release-2]
    env:
      E2E_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: npm ci
      - run: cp apps/web/.env.example apps/web/.env.local
      - name: Reserve the local stack's ports
        # The runner hands out 32768-60999 to outgoing connections, the image pulls of db:start among them, and a port of
        # the stack or of an Edge Function (544xx) taken that way fails its bind with "address already in use".
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54420-54439
      - name: Start the local stack
        # The reservation cannot free a port that a socket opened before it already holds (54424 has failed this way), so a
        # failed start lists the sockets on the stack's ports and starts once more.
        run: |
          npm run db:start && exit 0
          sudo ss -tanp | grep -E ':544[23][0-9]\b' || true
          npm run db:stop -- --no-backup
          sleep 20
          npm run db:start
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results-${{ matrix.group }}
          path: apps/web/test-results
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Production dependencies gate the build (NFR-S7). Dev tooling is reported
      # but not blocking: lint-only advisories (e.g. GHSA-vfj7-8cjw-p6xm in braces) can have no fix.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies (report only)
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: No Supabase secret keys outside supabase/
        run: "! git grep -nEi 'sb_secret_|service_role|SUPABASE_SECRET' -- . ':!supabase' ':!docs' ':!.github'"
