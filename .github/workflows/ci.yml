name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: cp apps/web/.env.example apps/web/.env.local
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:start
      - run: npm run db:test
      - run: npm run db:lint
      - run: npm run db:types
      - name: Fail when generated types differ from the committed file
        run: git diff --exit-code -- packages/db-types/src/database.ts
      - run: node scripts/gen-ref-seeds.mjs
      - name: Fail when regenerated reference seeds differ from the committed files
        run: git diff --exit-code -- supabase/seeds/ref

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check
      - run: deno lint
      - run: deno check "*/index.ts"
      - run: deno test --frozen

  e2e:
    needs: [web, db]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: cp apps/web/.env.example apps/web/.env.local
      - run: npm run db:start
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: apps/web/test-results
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Production dependencies gate the build (NFR-S7). Dev tooling is reported
      # but not blocking: lint-only advisories (e.g. GHSA-vfj7-8cjw-p6xm in braces) can have no fix.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies (report only)
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: No Supabase secret keys outside supabase/
        run: "! git grep -nEi 'sb_secret_|service_role|SUPABASE_SECRET' -- . ':!supabase' ':!docs' ':!.github'"
