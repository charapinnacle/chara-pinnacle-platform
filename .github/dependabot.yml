# Automated dependency updates (NFR-S7, security review SA-18). The npm entry covers every workspace through the root
# lockfile; the Actions entry moves the commit pins of .github/workflows and their version comments together.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
